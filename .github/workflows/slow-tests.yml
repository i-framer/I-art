name: Slow tests

# Runs the next-dev stall test suite (`pnpm test:slow`) on every pull request
# and on every push to main.  These tests each take ~50 s of real wall-clock
# time, so they run in a dedicated job with a generous timeout rather than
# alongside the fast unit-test suite.
#
# A failed slow test blocks the PR via the required status check
# "Slow tests / slow-tests (artwork-bank)".
#
# stall-guard-meta-test
# ─────────────────────
# Runs only on pushes to main.  It deliberately injects a stall regression
# (UPLOAD_READ_TIMEOUT_MS=1) and asserts that `pnpm test:slow` exits non-zero,
# proving the guard is still sensitive after a Next.js version bump.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  slow-tests:
    name: Slow tests (artwork-bank)
    runs-on: ubuntu-latest
    # Each test file takes ~50 s; allow ample headroom for startup + teardown.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe next-dev cold-start time
        # Measures how long `next dev` takes to become ready on a cold runner.
        # Fails (exit 1) if startup exceeds NEXTDEV_STARTUP_THRESHOLD_S seconds
        # so that regressions are caught at the CI step level — not silently
        # swallowed by the 180 s beforeAll budget in the slow-test suite.
        # Adjust the threshold by setting NEXTDEV_STARTUP_THRESHOLD_S here.
        env:
          NEXTDEV_STARTUP_THRESHOLD_S: "90"
        run: pnpm --filter @workspace/artwork-bank run probe:nextdev-startup

      - name: Run slow test suite
        run: pnpm --filter @workspace/artwork-bank run test:slow

  stall-guard-meta-test:
    name: Stall-guard meta-test (main only)
    # Only run on main merges — this job deliberately breaks the slow suite to
    # confirm the guard is still effective; it should not block PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The meta-test spawns next dev (up to 90 s startup) plus the helper server,
    # then runs test:slow once with the injected regression.  Budget generously.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm stall guard catches a regression
        run: bash scripts/meta-test-stall-guard.sh
