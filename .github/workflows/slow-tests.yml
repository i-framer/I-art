name: Slow tests

# Runs the next-dev stall test suite (`pnpm test:slow`) on every pull request
# and on every push to main.  These tests each take ~50 s of real wall-clock
# time, so they run in a dedicated job with a generous timeout rather than
# alongside the fast unit-test suite.
#
# A failed slow test blocks the PR via the required status check
# "Slow tests / slow-tests (artwork-bank)".
#
# stall-guard-meta-test
# ─────────────────────
# Runs only on pushes to main.  It deliberately injects a stall regression
# (UPLOAD_READ_TIMEOUT_MS=1) and asserts that `pnpm test:slow` exits non-zero,
# proving the guard is still sensitive after a Next.js version bump.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      startup_threshold_s:
        description: "Max seconds next-dev may take to become ready (overrides the hard-coded default)"
        default: "90"
        required: false

jobs:
  slow-tests:
    name: Slow tests (artwork-bank)
    runs-on: ubuntu-latest
    # Each test file takes ~50 s; allow ample headroom for startup + teardown.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe next-dev cold-start time
        # Measures how long `next dev` takes to become ready on a cold runner.
        # Fails (exit 1) if startup exceeds NEXTDEV_STARTUP_THRESHOLD_S seconds
        # so that regressions are caught at the CI step level — not silently
        # swallowed by the 180 s beforeAll budget in the slow-test suite.
        # Adjust the threshold by setting NEXTDEV_STARTUP_THRESHOLD_S here or
        # passing startup_threshold_s via workflow_dispatch.
        #
        # PROBE_RETAIN_CACHE=1: on success the probe keeps its .next-probe build
        # directory and writes a sentinel file.  The following slow-test step
        # detects the sentinel and reuses the warm cache, so next-dev is only
        # cold-started once per CI job instead of twice (~90 s saved).
        env:
          NEXTDEV_STARTUP_THRESHOLD_S: ${{ inputs.startup_threshold_s || '90' }}
          PROBE_RETAIN_CACHE: "1"
        run: pnpm --filter @workspace/artwork-bank run probe:nextdev-startup

      - name: Assert warm-cache sentinel exists
        # Fail fast with a clear message if the probe step did not write the
        # sentinel.  Without the sentinel, test:slow silently falls back to a
        # second cold start (wasting ~90 s) and CI still passes — hiding the
        # regression.  This step turns that silent failure into a hard error.
        run: |
          SENTINEL="artifacts/artwork-bank/.next-probe-cache-ready"
          if [[ ! -f "${SENTINEL}" ]]; then
            echo "✗ Warm-cache sentinel not found at '${SENTINEL}'." >&2
            echo "  The probe step should have written it when PROBE_RETAIN_CACHE=1" >&2
            echo "  and the cold-start completed within the threshold." >&2
            echo "  Without the sentinel, test:slow will cold-start next-dev a second" >&2
            echo "  time and the ~90 s saving will not materialise." >&2
            exit 1
          fi
          echo "✓ Sentinel found: $(cat "${SENTINEL}")"

      - name: Run slow test suite
        run: pnpm --filter @workspace/artwork-bank run test:slow

  probe-meta-test:
    name: Probe cold-start meta-test
    # Runs on every PR and push to main so that regressions in the probe
    # itself are caught before they silently affect the slow-test job.
    runs-on: ubuntu-latest
    # Scenario 1 waits up to 2 s (the injected threshold); scenario 2 exits in
    # milliseconds.  A 5-minute budget is more than sufficient.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm probe exits non-zero on timeout and early crash, and exits 0 with sentinel on WARN path
        # Exercises the three key paths in probe-nextdev-startup.ts via a fake
        # pnpm shim — no real next-dev is spawned so all scenarios run in
        # seconds and are fully deterministic:
        #   • timeout    — NEXTDEV_STARTUP_THRESHOLD_S=2 causes the probe to
        #                  give up before next-dev could ever become ready.
        #   • early crash — fake pnpm exits 1 immediately; probe must detect
        #                   the process death before the first HTTP poll.
        #   • WARN path  — fake pnpm serves HTTP at ~3.1 s with a 4 s
        #                  threshold (≥ 80%); probe must exit 0, emit
        #                  status=WARN, and write the warm-cache sentinel so
        #                  the hand-off still works in the warning band.
        run: bash scripts/meta-test-probe-nextdev.sh

  stall-guard-meta-test:
    name: Stall-guard meta-test
    # Only run on main merges or explicit workflow_dispatch — this job
    # deliberately breaks the slow suite to confirm the guard is still
    # effective; it should not block PRs.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The meta-test runs the probe first with PROBE_RETAIN_CACHE=1, then hands
    # the warm .next-probe cache to test:slow so next-dev is only cold-started
    # once (~90 s saved vs the old two-cold-start pattern).  The budget was
    # tightened from 15 → 13 min to match the confirmed saving.
    timeout-minutes: 13

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm stall guard catches a regression
        env:
          NEXTDEV_STARTUP_THRESHOLD_S: ${{ inputs.startup_threshold_s || '90' }}
        run: bash scripts/meta-test-stall-guard.sh
