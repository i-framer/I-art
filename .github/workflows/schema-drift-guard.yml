name: Schema-drift guard

# Verifies that:
#   1. The artwork-bank build script still chains check-drift before next build
#      (so no one can silently remove the gate).
#   2. check-drift exits 1 when DATABASE_URL is absent
#      (proves the guard actually fires when the secret is missing in Vercel).
#   3. check-drift exits 1 quickly when DATABASE_URL is set to a bad value
#      (catches stale / wrong URLs before a long TCP timeout hangs the build).
#   4. The pg client honours connectionTimeoutMillis within 5.5 s
#      (direct-client vitest smoke test — tight ceiling, no subprocess jitter).
#
# This job runs on every push / PR that touches relevant files and requires
# no live database — it deliberately omits or spoofs DATABASE_URL to test the guard.

on:
  push:
    paths:
      - "artifacts/artwork-bank/package.json"
      - "lib/db/scripts/check-drift.ts"
      - "lib/db/scripts/check-drift-logic.ts"
      - "lib/db/__tests__/check-drift-timeout.test.ts"
      - "lib/db/package.json"
      - "lib/db/vitest.config.ts"
      - ".github/workflows/schema-drift-guard.yml"
  pull_request:
    paths:
      - "artifacts/artwork-bank/package.json"
      - "lib/db/scripts/check-drift.ts"
      - "lib/db/scripts/check-drift-logic.ts"
      - "lib/db/__tests__/check-drift-timeout.test.ts"
      - "lib/db/package.json"
      - "lib/db/vitest.config.ts"
      - ".github/workflows/schema-drift-guard.yml"

jobs:
  schema-drift-guard:
    name: Schema-drift guard (no DB required)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Check 1: build script still gates on check-drift ─────────────────
      - name: Verify build script includes check-drift
        run: |
          BUILD_SCRIPT=$(node -e "const p=require('./artifacts/artwork-bank/package.json'); console.log(p.scripts.build ?? '')")
          echo "build script: $BUILD_SCRIPT"
          if [[ "$BUILD_SCRIPT" != *"check-drift"* ]]; then
            echo "❌  The 'build' script in artifacts/artwork-bank/package.json no longer"
            echo "    references check-drift. The DATABASE_URL guard has been removed."
            echo "    Restore it: \"build\": \"pnpm --filter @workspace/db run check-drift && next build\""
            exit 1
          fi
          # Also verify the check-drift call precedes next build (shell && ordering)
          if [[ "$BUILD_SCRIPT" != *"check-drift"*"next build"* ]]; then
            echo "❌  check-drift does not appear before 'next build' in the build script."
            echo "    The schema check must run first so a missing DATABASE_URL blocks the build."
            exit 1
          fi
          echo "✅  build script correctly gates on check-drift before next build."

      # ── Check 2: check-drift exits 1 when DATABASE_URL is absent ─────────
      - name: Assert check-drift exits 1 without DATABASE_URL
        run: |
          # Run the drift script with no DATABASE_URL set.
          # We expect exit code 1 and the specific error message.
          set +e
          OUTPUT=$(pnpm --filter @workspace/db run check-drift 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Exit code: $EXIT_CODE"
          echo "Output:    $OUTPUT"

          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "❌  check-drift exited with code $EXIT_CODE instead of 1."
            echo "    The DATABASE_URL guard is broken — a missing secret would not stop the build."
            exit 1
          fi

          if [[ "$OUTPUT" != *"DATABASE_URL"* ]]; then
            echo "❌  check-drift exited 1 but the output does not mention DATABASE_URL."
            echo "    The error message may have changed — verify the guard is still meaningful."
            exit 1
          fi

          echo "✅  check-drift correctly exits 1 with a clear DATABASE_URL error when the secret is absent."
        env:
          # Explicitly absent — this is the scenario we are testing.
          DATABASE_URL: ""

      # ── Check 3: check-drift exits 1 fast when DATABASE_URL is a bad value ─
      - name: Assert check-drift exits 1 quickly with a bad DATABASE_URL
        run: |
          # Use 192.0.2.1 (TEST-NET-1, RFC 5737) — a documentation-range address
          # never routed on the public internet.  Packets are dropped at the first
          # upstream router so no TCP RST is returned; the pg client must rely
          # solely on connectionTimeoutMillis to stop waiting.
          #
          # Ceiling = CONNECT_TIMEOUT_MS (5 s) + startup overhead.
          # Startup overhead budget (pnpm + tsx + Node.js module load) is up to
          # ~5 s on a GitHub-hosted runner — giving a total ceiling of 10 s.
          #
          # This is still far below the OS-level TCP timeout (~120 s), so the
          # check reliably catches a broken connectionTimeoutMillis.
          #
          # Note: the *mechanism* (whether pg actually honours the timeout) is
          # tested with a tight 5.5 s ceiling in the vitest smoke test
          # (lib/db/__tests__/check-drift-timeout.test.ts).  This step only
          # confirms that the full pnpm command does not hang indefinitely.
          set +e
          START=$(date +%s)
          OUTPUT=$(pnpm --filter @workspace/db run check-drift 2>&1)
          EXIT_CODE=$?
          END=$(date +%s)
          ELAPSED=$(( END - START ))
          set -e

          echo "Exit code: $EXIT_CODE"
          echo "Elapsed:   ${ELAPSED}s"
          echo "Output:    $OUTPUT"

          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "❌  check-drift exited with code $EXIT_CODE instead of 1 for a bad DATABASE_URL."
            exit 1
          fi

          # The script must honour connectionTimeoutMillis and NOT hang for the
          # OS-level TCP timeout.  10 s ceiling = 5 s timeout + ~5 s startup overhead.
          if [ "$ELAPSED" -gt 10 ]; then
            echo "❌  check-drift took ${ELAPSED}s — connectionTimeoutMillis is not being honoured."
            echo "    Expected exit within 10 s (5 s timeout + startup overhead)."
            echo "    Without connectionTimeoutMillis the OS TCP timeout would block for ~120 s."
            exit 1
          fi

          # The error message for a bad URL must be distinct from the missing-URL message.
          if [[ "$OUTPUT" == *"DATABASE_URL is not set"* ]]; then
            echo "❌  check-drift reported a missing-URL error for a set-but-wrong DATABASE_URL."
            echo "    The two failure modes must have distinct messages."
            exit 1
          fi

          if [[ "$OUTPUT" != *"DATABASE_URL"* ]]; then
            echo "❌  check-drift exited 1 but the output does not mention DATABASE_URL."
            exit 1
          fi

          echo "✅  check-drift correctly exits 1 in ${ELAPSED}s with a distinct error for a bad DATABASE_URL."
        env:
          # 192.0.2.1 — TEST-NET-1 (RFC 5737).  Not routed on the public internet;
          # packets are silently dropped, creating a real TCP blackhole that forces
          # the pg client to rely on connectionTimeoutMillis rather than a fast RST.
          DATABASE_URL: "postgresql://user:password@192.0.2.1:5432/testdb"

      # ── Check 4: connectionTimeoutMillis fires correctly (vitest, local stalling server) ──
      - name: Assert connectionTimeoutMillis fires correctly (vitest smoke tests)
        run: |
          # Runs lib/db/__tests__/check-drift-timeout.test.ts via vitest.
          #
          # Both tests in that file use a local TCP server that completes the
          # OS-level handshake but never writes the PostgreSQL startup response.
          # This guarantees the failure is a connectionTimeoutMillis timeout,
          # not a fast ECONNREFUSED — and it is fully deterministic (no
          # dependence on external routing or firewall rules).
          #
          # Test 1 (direct pg Client, 5.5 s ceiling):
          #   Creates a pg Client with the same CONNECT_TIMEOUT_MS value used
          #   by check-drift.ts and asserts it rejects within 5 500 ms with a
          #   "timeout" error.  Tight ceiling; no subprocess overhead.
          #
          # Test 2 (subprocess, 8 s ceiling):
          #   Runs the actual check-drift.ts script against the stalling server.
          #   If CONNECT_TIMEOUT_MS is removed or raised in check-drift.ts this
          #   test fails, providing a direct regression guard on the production
          #   configuration.
          pnpm --filter @workspace/db exec vitest run __tests__/check-drift-timeout.test.ts
        env:
          # DATABASE_URL must be absent so the test injects the stalling-server
          # URL itself without the real production URL interfering.
          DATABASE_URL: ""
