name: Artwork Bank browser regression

on:
  pull_request:
    paths:
      - "artifacts/artwork-bank/**"
      - "lib/db/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/artwork-bank-browser-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-favicon:
    name: Storefront favicon smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This must be a dedicated non-production database. The browser-test
      # guard requires both variables to match before it permits fixture writes.
      DATABASE_URL: ${{ secrets.BROWSER_TEST_DATABASE_URL }}
      BROWSER_TEST_DATABASE_URL: ${{ secrets.BROWSER_TEST_DATABASE_URL }}
      BROWSER_TEST_MODE: enabled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm isolated browser-test database is configured
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure the BROWSER_TEST_DATABASE_URL repository secret with a dedicated non-production database."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/artwork-bank exec playwright install --with-deps chromium

      - name: Run storefront favicon regression
        run: pnpm --filter @workspace/artwork-bank exec playwright test e2e/favicon.spec.ts