name: Mtime-tolerance guard

# Asserts that the MTIME_TRUNCATION_TOLERANCE_MS default in
# artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts is exactly
# 1 000 ms.
#
# Background
# ──────────
# MTIME_TRUNCATION_TOLERANCE_MS adds a 1-second buffer to the stale-sentinel
# rejection threshold so that a genuinely fresh sentinel is never discarded
# just because the filesystem truncated its mtime to 1-second precision
# (ext3, HFS+, FAT, some network filesystems).  The safe minimum is 1 000 ms.
#
# If the constant is silently lowered below 800 ms the probe-cache acceptance
# test catches the regression — but only after a full slow-test run (~50 s per
# test file).  This grep-based check catches the mutation in seconds, before
# any test runner starts, so a weakened tolerance is blocked at the PR level.
#
# No build step, no test runner, no secrets — just awk + grep on the source file.

on:
  push:
    paths:
      - "artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"
      - ".github/workflows/mtime-tolerance-guard.yml"
  pull_request:
    paths:
      - "artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"
      - ".github/workflows/mtime-tolerance-guard.yml"

jobs:
  mtime-tolerance-guard:
    name: Mtime-tolerance guard (static check)
    runs-on: ubuntu-latest
    # No pnpm, no Node — this is a pure grep / awk check.
    # Budget is generous; in practice the job finishes in < 10 s.
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      # ── Check 1: constant declaration still present ───────────────────────
      - name: Assert MTIME_TRUNCATION_TOLERANCE_MS constant is still declared
        run: |
          FILE="artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"

          if ! grep -q "MTIME_TRUNCATION_TOLERANCE_MS" "$FILE"; then
            echo "❌  MTIME_TRUNCATION_TOLERANCE_MS is no longer declared in $FILE."
            echo "    The constant may have been renamed or the file moved."
            echo "    Update this guard (and the path above) to match."
            exit 1
          fi
          echo "✅  MTIME_TRUNCATION_TOLERANCE_MS declaration found in $FILE."

      # ── Check 2: default value is exactly 1 000 ms ───────────────────────
      #
      # The constant is defined as an IIFE that falls through to a bare
      # `return 1000;` when the environment variable is absent:
      #
      #   export const MTIME_TRUNCATION_TOLERANCE_MS: number = (() => {
      #     const env = process.env["MTIME_TRUNCATION_TOLERANCE_MS"];
      #     if (env !== undefined && env !== "") {
      #       const parsed = Number(env);
      #       if (Number.isFinite(parsed) && parsed >= 0) return parsed;
      #     }
      #     return 1000;   ← this is what we assert
      #   })();
      #
      # awk reads between the const declaration and the closing })(); line,
      # collecting every `return <digits>;` it sees.  The last one encountered
      # is the fallback default.  grep -oP extracts the bare number.
      - name: Assert MTIME_TRUNCATION_TOLERANCE_MS default is exactly 1000 ms
        run: |
          FILE="artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"

          DEFAULT_VALUE=$(awk '
            /MTIME_TRUNCATION_TOLERANCE_MS[^=]*=.*\(\(\)/ { in_block=1 }
            in_block && /return [0-9]+;/ { last_return=$0 }
            in_block && /^\}\)\(\);/ { in_block=0 }
            END { print last_return }
          ' "$FILE" | grep -oP '\b[0-9]+\b')

          echo "Extracted default return value: '${DEFAULT_VALUE}'"

          if [ -z "$DEFAULT_VALUE" ]; then
            echo "❌  Could not extract a numeric default from the MTIME_TRUNCATION_TOLERANCE_MS IIFE."
            echo "    Possible causes:"
            echo "      • The IIFE pattern changed (no longer ends with 'return <number>;')."
            echo "      • The closing '})();' line was reformatted."
            echo "    Update this guard to match the new constant shape."
            exit 1
          fi

          if [ "$DEFAULT_VALUE" -ne 1000 ]; then
            echo "❌  MTIME_TRUNCATION_TOLERANCE_MS default is ${DEFAULT_VALUE} ms — expected 1000 ms."
            echo ""
            echo "    Why 1000 ms matters:"
            echo "      Filesystems that store mtime at 1-second precision (ext3, HFS+,"
            echo "      FAT, some network filesystems) can make a freshly-written sentinel"
            echo "      appear up to 999 ms older than its true age.  Without a 1 000 ms"
            echo "      buffer the stale-sentinel guard may discard a valid cache and force"
            echo "      an unnecessary cold start."
            echo ""
            echo "    A value below 1000 ms is caught by the acceptance tests — but only"
            echo "    after a full slow-test run (~50 s per file).  This check catches the"
            echo "    regression instantly, before any test runner starts."
            echo ""
            echo "    Restore the default to 1000 in:"
            echo "      $FILE"
            exit 1
          fi

          echo "✅  MTIME_TRUNCATION_TOLERANCE_MS default is correctly set to 1000 ms."

      # ── Check 3: zero-tolerance override guard is `parsed >= 0` ─────────
      #
      # The MTIME_TRUNCATION_TOLERANCE_MS IIFE deliberately uses `parsed >= 0`
      # (not `parsed > 0`) so that setting the env var to "0" selects zero-
      # tolerance mode rather than falling through to the 1 000 ms default.
      # Meta-tests rely on this: they set MTIME_TRUNCATION_TOLERANCE_MS=0 to
      # verify the stale-sentinel guard fires for any overshoot, however small.
      #
      # If the guard were accidentally changed to `parsed > 0`, the literal
      # string "0" would be rejected and the IIFE would silently return 1 000 ms,
      # causing meta-tests to run with the wrong tolerance.
      #
      # This step asserts the source-level guard condition — the quickest
      # possible signal before any test runner starts.  The runtime behaviour
      # (that the constant actually evaluates to 0 when the env var is "0" and
      # that consumeProbeCache rejects the sentinel) is verified by the targeted
      # subprocess integration test:
      #
      #   artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.test.ts
      #   describe("subprocess environment integration (tolerance-guard CI override)")
      #   → "resolves to 0 ms … when MTIME_TRUNCATION_TOLERANCE_MS is set to
      #      the literal string '0' in the subprocess environment"
      #
      # That test spawns probe-cache-mtime-env-check.ts via tsx, which imports
      # the real module — no duplicated IIFE logic.
      - name: Assert MTIME_TRUNCATION_TOLERANCE_MS IIFE uses parsed >= 0 (zero-tolerance guard)
        run: |
          FILE="artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"

          # Extract the MTIME_TRUNCATION_TOLERANCE_MS IIFE block.
          IIFE_BLOCK=$(awk '
            /MTIME_TRUNCATION_TOLERANCE_MS[^=]*=.*\(\(\)/ { in_block=1 }
            in_block { print }
            in_block && /^\}\)\(\);/ { in_block=0 }
          ' "$FILE")

          if [ -z "$IIFE_BLOCK" ]; then
            echo "❌  Could not locate the MTIME_TRUNCATION_TOLERANCE_MS IIFE block in $FILE."
            echo "    The constant may have been renamed or reformatted."
            echo "    Update this guard (and the path above) to match."
            exit 1
          fi

          if echo "$IIFE_BLOCK" | grep -qE 'parsed\s*>=\s*0'; then
            echo "✅  MTIME IIFE guard is 'parsed >= 0' — literal '0' is accepted as a valid zero-tolerance override."
          else
            echo "❌  The MTIME_TRUNCATION_TOLERANCE_MS IIFE does not contain 'parsed >= 0'."
            echo ""
            echo "    Guard line found in the IIFE:"
            echo "$IIFE_BLOCK" | grep -E 'Number\.isFinite' || echo "    (no Number.isFinite line found)"
            echo ""
            echo "    Why this matters:"
            echo "      MTIME_TRUNCATION_TOLERANCE_MS=0 is the zero-tolerance mode used"
            echo "      by meta-tests.  If the guard reads 'parsed > 0', the literal"
            echo "      string '0' is rejected and the IIFE silently falls through to"
            echo "      the 1 000 ms default — meta-tests then run with the wrong"
            echo "      tolerance, hiding genuine regressions."
            echo ""
            echo "    Runtime confirmation: probe-cache.test.ts"
            echo "      describe('subprocess environment integration (tolerance-guard CI override)')"
            echo "      → 'resolves to 0 ms … when … set to the literal string \"0\"'"
            echo ""
            echo "    Fix: restore 'parsed >= 0' in the IIFE guard in:"
            echo "      $FILE"
            exit 1
          fi

      # ── Check 4: MAX_SENTINEL_AGE_HOURS constant is still declared ────────
      - name: Assert MAX_SENTINEL_AGE_HOURS constant is still declared
        run: |
          FILE="artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"

          if ! grep -q "MAX_SENTINEL_AGE_HOURS" "$FILE"; then
            echo "❌  MAX_SENTINEL_AGE_HOURS is no longer declared in $FILE."
            echo "    The constant may have been renamed or the file moved."
            echo "    Update this guard (and the path above) to match."
            exit 1
          fi
          echo "✅  MAX_SENTINEL_AGE_HOURS declaration found in $FILE."

      # ── Check 5: MAX_SENTINEL_AGE_HOURS default is exactly 24 ────────────
      #
      # The constant is defined as an IIFE that falls through to a bare
      # `return 24;` when the environment variable is absent:
      #
      #   export const MAX_SENTINEL_AGE_HOURS: number = (() => {
      #     const env = process.env["MAX_SENTINEL_AGE_HOURS"];
      #     if (env !== undefined && env !== "") {
      #       const parsed = Number(env);
      #       if (Number.isFinite(parsed) && parsed > 0) return parsed;
      #     }
      #     return 24;   ← this is what we assert
      #   })();
      #
      # awk reads between the const declaration and the closing })(); line,
      # collecting every `return <digits>;` it sees.  The last one encountered
      # is the fallback default.  grep -oP extracts the bare number.
      - name: Assert MAX_SENTINEL_AGE_HOURS default is exactly 24
        run: |
          FILE="artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"

          DEFAULT_VALUE=$(awk '
            /MAX_SENTINEL_AGE_HOURS[^=]*=.*\(\(\)/ { in_block=1 }
            in_block && /return [0-9]+;/ { last_return=$0 }
            in_block && /^\}\)\(\);/ { in_block=0 }
            END { print last_return }
          ' "$FILE" | grep -oP '\b[0-9]+\b')

          echo "Extracted default return value: '${DEFAULT_VALUE}'"

          if [ -z "$DEFAULT_VALUE" ]; then
            echo "❌  Could not extract a numeric default from the MAX_SENTINEL_AGE_HOURS IIFE."
            echo "    Possible causes:"
            echo "      • The IIFE pattern changed (no longer ends with 'return <number>;')."
            echo "      • The closing '})();' line was reformatted."
            echo "    Update this guard to match the new constant shape."
            exit 1
          fi

          if [ "$DEFAULT_VALUE" -ne 24 ]; then
            echo "❌  MAX_SENTINEL_AGE_HOURS default is ${DEFAULT_VALUE} — expected 24."
            echo ""
            echo "    Why 24 matters:"
            echo "      Sentinels older than 24 hours were almost certainly left over"
            echo "      from a prior CI run whose workspace directory was inadvertently"
            echo "      cached.  Reusing such a sentinel risks a corrupt or mismatched"
            echo "      .next-probe build output."
            echo ""
            echo "    Restore the default to 24 in:"
            echo "      $FILE"
            exit 1
          fi

          echo "✅  MAX_SENTINEL_AGE_HOURS default is correctly set to 24."

      # ── Check 6: zero age is rejected — IIFE guard is `parsed > 0` ───────
      #
      # The MAX_SENTINEL_AGE_HOURS IIFE deliberately uses `parsed > 0`
      # (not `parsed >= 0`) so that setting the env var to "0" is treated as
      # invalid and the IIFE falls through to the 24-hour default.  Zero hours
      # is not a meaningful sentinel age — it would discard every sentinel
      # immediately.
      #
      # This is the intentional asymmetry with MTIME_TRUNCATION_TOLERANCE_MS,
      # which uses `parsed >= 0` because zero IS valid there (zero-tolerance mode).
      #
      # If the guard were accidentally changed to `parsed >= 0`, setting
      # MAX_SENTINEL_AGE_HOURS=0 in the environment would silently produce a
      # zero-hour age, discarding every cache hit and causing confusing CI failures.
      - name: Assert MAX_SENTINEL_AGE_HOURS IIFE uses parsed > 0 (zero is not a valid age)
        run: |
          FILE="artifacts/artwork-bank/__tests__/slow/helpers/probe-cache.ts"

          # Extract the MAX_SENTINEL_AGE_HOURS IIFE block.
          IIFE_BLOCK=$(awk '
            /MAX_SENTINEL_AGE_HOURS[^=]*=.*\(\(\)/ { in_block=1 }
            in_block { print }
            in_block && /^\}\)\(\);/ { in_block=0 }
          ' "$FILE")

          if [ -z "$IIFE_BLOCK" ]; then
            echo "❌  Could not locate the MAX_SENTINEL_AGE_HOURS IIFE block in $FILE."
            echo "    The constant may have been renamed or reformatted."
            echo "    Update this guard (and the path above) to match."
            exit 1
          fi

          # The guard must be strictly `parsed > 0`, not `parsed >= 0`.
          if echo "$IIFE_BLOCK" | grep -qE 'parsed\s*>=\s*0'; then
            echo "❌  The MAX_SENTINEL_AGE_HOURS IIFE contains 'parsed >= 0'."
            echo ""
            echo "    Guard line found in the IIFE:"
            echo "$IIFE_BLOCK" | grep -E 'Number\.isFinite' || echo "    (no Number.isFinite line found)"
            echo ""
            echo "    Why this matters:"
            echo "      Zero hours is not a valid sentinel age — a zero-hour sentinel"
            echo "      would be discarded immediately on every check.  The guard must"
            echo "      use 'parsed > 0' so that MAX_SENTINEL_AGE_HOURS=0 falls through"
            echo "      to the 24-hour default rather than silently accepting an"
            echo "      unusable value."
            echo ""
            echo "    This constant is intentionally asymmetric with"
            echo "    MTIME_TRUNCATION_TOLERANCE_MS, which accepts 0 as a valid"
            echo "    zero-tolerance override.  Keep them different."
            echo ""
            echo "    Fix: restore 'parsed > 0' (not '>= 0') in the IIFE guard in:"
            echo "      $FILE"
            exit 1
          fi

          if echo "$IIFE_BLOCK" | grep -qE 'parsed\s*>\s*0'; then
            echo "✅  MAX_SENTINEL_AGE_HOURS IIFE guard is 'parsed > 0' — zero is correctly rejected as an invalid age."
          else
            echo "❌  The MAX_SENTINEL_AGE_HOURS IIFE does not contain a recognisable 'parsed > 0' guard."
            echo ""
            echo "    Guard line found in the IIFE:"
            echo "$IIFE_BLOCK" | grep -E 'Number\.isFinite' || echo "    (no Number.isFinite line found)"
            echo ""
            echo "    Update this guard if the IIFE structure has changed, or restore"
            echo "    the expected guard condition in:"
            echo "      $FILE"
            exit 1
          fi
